<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head><body>
<title>Invocateurs d'Ombrelune</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400;1,500&display=swap">
<style>
/* Layout : une boutique de nuit sous la lune — en-tête collant, contenu défilant, barre d'onglets en bas ; l'ouverture de booster prend tout l'écran. */
:root{
  --night:#100d1a; --night2:#1a1530; --panel:#221c38; --panel2:#2b2447; --line:#3d3460;
  --ink:#f3ead6; --muted:#a79dc2; --moon:#f5d77e; --moon-ink:#2b1f05; --ok:#6fdc8c; --bad:#ff6b6f;
  --c:#9a99a4; --p:#79d391; --r:#6fb2ff; --e:#c58bff; --l:#ffcf5a; --m:#ff7ad9;
  --f-display:"Grenze Gotisch", "Palatino Linotype", Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{
  min-height:100%;
  background:
    radial-gradient(circle at 18% 12%, rgba(255,255,255,.55) 0 1px, transparent 1.5px) 0 0/97px 89px,
    radial-gradient(circle at 63% 41%, rgba(255,255,255,.35) 0 1px, transparent 1.5px) 0 0/131px 113px,
    radial-gradient(120% 60% at 50% 0%, #2a2150, var(--night) 70%) fixed,
    var(--night);
  color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.4;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--night)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* ——— En-tête ——— */
header.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:9;background:color-mix(in srgb,var(--night) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{font-family:var(--f-display);font-size:24px;line-height:1;color:var(--moon);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coins{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--panel2);border:1px solid color-mix(in srgb,var(--moon) 45%,var(--line));font-weight:800;font-variant-numeric:tabular-nums}
.coins .ic{font-size:15px}
.sync{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.sync.cloud{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.sync.saving{background:var(--moon)}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom, 0px))}
main .wrap{padding-block:16px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);font-weight:800;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:34px}
h2{font-size:26px}
.lead{color:var(--muted);margin:0;max-width:60ch}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ——— Onglets ——— */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:color-mix(in srgb,var(--night) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px))}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.04em}
nav.tabs a .i{font-size:21px;line-height:1;filter:grayscale(.7);opacity:.8}
nav.tabs a[aria-current="page"]{color:var(--moon)}
nav.tabs a[aria-current="page"] .i{filter:none;opacity:1}

/* ——— Boutons ——— */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 18px;font-weight:800;background:var(--moon);color:var(--moon-ink);font-size:16px}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.free{background:linear-gradient(90deg,#7ef0c0,#7ec8ff);color:#06222a}
.btn[disabled]{background:var(--panel2);color:var(--muted);border-color:var(--line)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--moon);color:var(--moon-ink);border-color:var(--moon)}

/* ——— Boutique ——— */
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:linear-gradient(100deg,color-mix(in srgb,#7ef0c0 18%,var(--panel)),var(--panel));border:1px solid var(--line)}
.banner .t{flex:1;min-width:0}
.banner b{display:block}
.banner small{color:var(--muted);font-variant-numeric:tabular-nums}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.offer{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;min-width:0}
.offer .meta{font-size:13px;color:var(--muted)}
.offer .meta b{color:var(--ink)}
.offer .acts{display:flex;flex-direction:column;gap:8px;width:100%}
.bar{height:6px;border-radius:3px;background:var(--night);overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--moon),#fff1c2);border-radius:3px}
details.odds{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
details.odds summary{font-weight:800;cursor:pointer}
.oddtable{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px;font-variant-numeric:tabular-nums}
.oddtable td{padding:5px 0;border-bottom:1px solid var(--line)}
.oddtable td:last-child{text-align:right;color:var(--muted)}
.gem{font-weight:800}
.g-C{color:var(--c)}.g-P{color:var(--p)}.g-R{color:var(--r)}.g-E{color:var(--e)}.g-L{color:var(--l)}
.g-M{background:linear-gradient(90deg,#ff7ad9,#ffd66b,#7ef0c0,#7ec8ff,#c58bff);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ——— Booster (emballage) ——— */
.pk{container-type:inline-size;width:var(--pw,170px);max-width:100%}
.pack{
  position:relative;aspect-ratio:.64;border-radius:4cqw;overflow:hidden;
  background:
    radial-gradient(circle at 50% 38%, color-mix(in srgb,var(--pa) 55%,transparent) 0 22cqw, transparent 42cqw),
    repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 3cqw, transparent 3cqw 6cqw),
    linear-gradient(165deg,var(--p1),var(--p2));
  box-shadow:0 2cqw 0 rgba(0,0,0,.25), 0 8cqw 16cqw rgba(0,0,0,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;color:#fff;
}
.pack::before,.pack .tear{content:"";position:absolute;left:0;right:0;height:7%;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 2.5cqw, rgba(0,0,0,.25) 2.5cqw 5cqw)}
.pack::before{bottom:0}
.pack .tear{top:0;transition:transform .5s cubic-bezier(.5,-.3,.6,1), opacity .5s}
.pack::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.38) 50%,transparent 62%);background-size:300% 100%;animation:sheen 3.6s ease-in-out infinite;pointer-events:none}
.pack .emb{font-size:34cqw;line-height:1;filter:drop-shadow(0 0 6cqw var(--pa))}
.pack .pn{font-family:var(--f-display);font-size:11.5cqw;line-height:.95;text-align:center;padding:0 8cqw;text-shadow:0 1cqw 0 rgba(0,0,0,.5);text-wrap:balance}
.pack .pc{font-size:6cqw;letter-spacing:.2em;text-transform:uppercase;opacity:.85;font-weight:800}
.pack .logo{position:absolute;top:11%;font-family:var(--f-display);font-size:7.5cqw;letter-spacing:.06em;color:var(--moon);opacity:.95}
.pack .six{position:absolute;bottom:11%;font-size:5.2cqw;font-weight:800;padding:1cqw 4cqw;border-radius:99px;background:rgba(0,0,0,.35)}

/* ——— Carte ——— */
.tc{container-type:inline-size;width:100%;position:relative}
.face{
  position:relative;aspect-ratio:63/88;border-radius:5cqw;padding:3.3cqw;display:flex;flex-direction:column;
  background:var(--frame);box-shadow:0 1.5cqw 5cqw rgba(0,0,0,.45);overflow:hidden;color:#fff;
}
.r-C .face{--frame:linear-gradient(150deg,#b9b8c2,#5d5c66 55%,#8e8d97)}
.r-P .face{--frame:linear-gradient(150deg,#c9f2d2,#3d8a57 55%,#9fdcb0)}
.r-R .face{--frame:linear-gradient(150deg,#d5e8ff,#3561a8 55%,#9cc6ff)}
.r-E .face{--frame:linear-gradient(150deg,#f0d9ff,#6a2fa6 50%,#d3a6ff)}
.r-L .face{--frame:linear-gradient(120deg,#fff3c4,#c4881c 30%,#ffe189 50%,#a86c10 70%,#fff0b5);background-size:250% 250%;animation:goldframe 5s ease-in-out infinite}
.r-M .face{--frame:conic-gradient(from var(--ang,0deg),#ff7ad9,#ffd66b,#7ef0c0,#7ec8ff,#c58bff,#ff7ad9);animation:spinframe 6s linear infinite}
.inner{flex:1;display:flex;flex-direction:column;gap:1.8cqw;border-radius:3cqw;padding:2.4cqw;min-height:0;
  background:linear-gradient(172deg, color-mix(in srgb,var(--ea) 55%,#1a1426), color-mix(in srgb,var(--eb) 85%,#0c0a12) 80%);
  box-shadow:inset 0 0 0 .5cqw rgba(0,0,0,.35)}
.hd{display:flex;align-items:center;gap:2cqw}
.hd .nm{flex:1;min-width:0;font-family:var(--f-display);font-size:6.6cqw;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 .6cqw 0 rgba(0,0,0,.5)}
.hd .nm.long{font-size:5.4cqw}
.hd .es{width:8.5cqw;height:8.5cqw;flex:none;border-radius:50%;display:grid;place-items:center;font-size:5cqw;background:rgba(0,0,0,.35);box-shadow:0 0 0 .5cqw color-mix(in srgb,var(--ea) 70%,#fff)}
.art{position:relative;height:53cqw;flex:none;border-radius:2cqw;overflow:hidden;box-shadow:inset 0 0 0 .7cqw rgba(0,0,0,.45);
  background:
    radial-gradient(circle at var(--sx) var(--sy), var(--glow) 0 var(--ss), color-mix(in srgb,var(--glow) 30%,transparent) calc(var(--ss) + 1cqw), transparent calc(var(--ss) + 9cqw)),
    radial-gradient(circle, rgba(255,255,255,.85) 0 .35cqw, transparent .6cqw) var(--st1) / 13cqw 11cqw,
    radial-gradient(circle, rgba(255,255,255,.5) 0 .3cqw, transparent .5cqw) var(--st2) / 19cqw 17cqw,
    linear-gradient(180deg, var(--sky1), var(--sky2));}
.art .ground{position:absolute;inset:auto 0 0 0;height:45%;
  background:
    radial-gradient(ellipse 60% 70% at var(--h1) 100%, color-mix(in srgb,var(--eb) 85%,#000) 0 60%, transparent 61%),
    radial-gradient(ellipse 70% 55% at var(--h2) 100%, color-mix(in srgb,var(--eb) 60%,#000) 0 60%, transparent 61%)}
.art .rays{position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.13) 0 6deg, transparent 6deg 18deg);animation:spin 24s linear infinite}
.art .halo{position:absolute;left:50%;top:52%;width:44cqw;height:44cqw;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle, color-mix(in srgb,var(--glow) 55%,transparent), transparent 68%)}
.art .em{position:absolute;inset:0;display:grid;place-items:center;font-size:29cqw;line-height:1;filter:drop-shadow(0 1.5cqw 0 rgba(0,0,0,.35)) drop-shadow(0 0 4cqw color-mix(in srgb,var(--glow) 70%,transparent))}
.typ{display:flex;justify-content:space-between;align-items:center;gap:2cqw;font-size:3.9cqw;font-weight:700;padding:1cqw 2.2cqw;border-radius:1.6cqw;background:rgba(0,0,0,.38);white-space:nowrap}
.typ span:first-child{overflow:hidden;text-overflow:ellipsis}
.typ .gem{font-size:4.6cqw}
.flv{flex:1;min-height:0;font-style:italic;font-size:4.9cqw;line-height:1.3;padding:2cqw 2.4cqw;border-radius:1.6cqw;background:rgba(255,255,255,.09);color:#efe6d6;overflow:hidden}
.ft{display:flex;justify-content:space-between;align-items:center;font-size:3.5cqw;font-weight:800;font-variant-numeric:tabular-nums;padding:0 .6cqw}
.ft .st{display:flex;gap:2.4cqw}
.ft .no{opacity:.8;letter-spacing:.05em}
/* Brillante */
.tc.foil .face::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:color-dodge;opacity:.55;
  background:linear-gradient(115deg,transparent 18%,rgba(255,60,180,.55) 30%,rgba(60,255,255,.55) 40%,rgba(255,255,90,.5) 50%,rgba(80,255,140,.5) 60%,rgba(140,110,255,.55) 70%,transparent 82%);
  background-size:260% 260%;background-position:var(--fx,50%) var(--fy,50%);animation:foil 5s ease-in-out infinite alternate}
.tc.foil.live .face::after{animation:none}
.tc.foil .face::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  background:radial-gradient(circle at var(--gx,30%) var(--gy,20%), rgba(255,255,255,.35), transparent 45%);mix-blend-mode:overlay}
.badge{position:absolute;z-index:3;font-size:11px;font-weight:800;letter-spacing:.06em;padding:2px 7px;border-radius:99px;text-transform:uppercase;white-space:nowrap}
.badge.new{top:-7px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06240f;box-shadow:0 0 10px var(--ok)}
.badge.cnt{bottom:-6px;right:-4px;background:var(--night);border:1px solid var(--line);color:var(--ink);font-size:12px;text-transform:none}
.badge.fo{bottom:-6px;left:-4px;background:linear-gradient(90deg,#ff7ad9,#7ef0c0,#7ec8ff);color:#1a0f24}
/* Manquante */
.tc.missing .face{--frame:linear-gradient(150deg,#2e2747,#1b1630);box-shadow:none;border:1px dashed var(--line)}
.tc.missing .inner{background:linear-gradient(172deg,#211b36,#141022);box-shadow:none}
.tc.missing .art{background:linear-gradient(180deg,#1d1830,#151125)}
.tc.missing .em{filter:brightness(0) opacity(.55)}
.tc.missing .nm,.tc.missing .flv,.tc.missing .typ span:first-child{color:var(--muted)}
.tc.missing .ground,.tc.missing .halo,.tc.missing .rays{display:none}
/* Dos de carte */
.back{aspect-ratio:63/88;border-radius:5cqw;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 50% 50%, rgba(245,215,126,.25) 0 18cqw, transparent 34cqw),
    radial-gradient(circle, rgba(255,255,255,.6) 0 .4cqw, transparent .7cqw) 0 0/11cqw 13cqw,
    linear-gradient(160deg,#2b2160,#120d29);
  box-shadow:inset 0 0 0 3cqw #1a1438, inset 0 0 0 3.8cqw var(--moon), inset 0 0 0 6cqw #1a1438, 0 2cqw 6cqw rgba(0,0,0,.5);
  display:grid;place-items:center}
.back .mo{font-size:30cqw;filter:drop-shadow(0 0 5cqw var(--moon))}
.back .wd{position:absolute;bottom:13%;width:100%;text-align:center;font-family:var(--f-display);font-size:8cqw;color:var(--moon);letter-spacing:.08em}
.back.aura-R{box-shadow:inset 0 0 0 3cqw #1a1438, inset 0 0 0 3.8cqw var(--moon), inset 0 0 0 6cqw #1a1438, 0 0 10cqw var(--r)}
.back.aura-E{box-shadow:inset 0 0 0 3cqw #1a1438, inset 0 0 0 3.8cqw var(--moon), inset 0 0 0 6cqw #1a1438, 0 0 14cqw var(--e);animation:throb 1.2s ease-in-out infinite}
.back.aura-L{box-shadow:inset 0 0 0 3cqw #1a1438, inset 0 0 0 3.8cqw var(--moon), inset 0 0 0 6cqw #1a1438, 0 0 18cqw var(--l);animation:throb .9s ease-in-out infinite}
.back.aura-M{box-shadow:inset 0 0 0 3cqw #1a1438, inset 0 0 0 3.8cqw var(--moon), inset 0 0 0 6cqw #1a1438, 0 0 20cqw var(--m), 0 0 40cqw #7ec8ff;animation:throb .7s ease-in-out infinite}

/* ——— Collection ——— */
.prog{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px}
.prog .row{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums;font-size:14px}
.prog .row b{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:16px 12px}
.slot{position:relative;display:block;width:100%;padding:0;text-align:left}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .sp{flex:1}
.empty{color:var(--muted);text-align:center;padding:30px 10px}

/* ——— Profil ——— */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.rows{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.rows .r{display:grid;grid-template-columns:110px 1fr 64px;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.rows .r:last-child{border-bottom:0}
.rows .r span:last-child{text-align:right;color:var(--muted)}
.note{font-size:13.5px;color:var(--muted)}

/* ——— Superpositions ——— */
.ov{position:fixed;inset:0;z-index:50;background:radial-gradient(100% 70% at 50% 40%, #2b2158 0%, #0b0915 75%);display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px));overflow:hidden}
.ov .bar2{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:40px}
.ov .bar2 .ttl{font-family:var(--f-display);font-size:22px;color:var(--moon)}
.ov .stage{flex:1;width:100%;display:grid;place-items:center;position:relative;perspective:1200px;min-height:0}
.ov .hint{color:var(--muted);font-size:14px;text-align:center;min-height:22px}
.ov .foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%;max-width:520px}
.packstage{display:grid;place-items:center;gap:16px;cursor:pointer}
.packstage .pk{--pw:min(62vw, 250px, calc(44vh * .64))}
.packstage .pk.wiggle .pack{animation:wiggle .9s ease-in-out infinite}
.packstage .pk.torn .tear{transform:translate(-25%,-160%) rotate(-14deg);opacity:0}
.packstage .pk.out{transition:transform .5s ease-in, opacity .5s;transform:translateY(40%) scale(.9);opacity:0}
.flipper{width:min(74vw, 320px, calc(56vh * .716));position:relative;cursor:pointer}
.flipper .fl-in{position:relative;aspect-ratio:63/88;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.3,1.3,.5,1)}
.flipper .fl-in > *{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flipper .fl-front{transform:rotateY(180deg)}
.flipper.flipped .fl-in{transform:rotateY(180deg)}
.flipper.enter{animation:dealIn .4s cubic-bezier(.2,1.2,.4,1)}
.flipper.leave{transition:transform .35s ease-in, opacity .35s;transform:translateX(-120%) rotate(-14deg);opacity:0}
.ov .stage > *{grid-area:1/1}
.flipper{z-index:1}
.stack{position:relative;aspect-ratio:63/88;width:min(74vw, 320px, calc(56vh * .716));pointer-events:none}
.stack .pile{container-type:inline-size;position:absolute;inset:0}
.counter{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.reveal-label{position:absolute;left:0;right:0;bottom:-46px;text-align:center;font-family:var(--f-display);font-size:26px;opacity:0;transition:opacity .3s}
.flipped .reveal-label{opacity:1}

E|o|🌒|Mage de la nuit polaire|Sorcier|Il vole six mois de lumière chaque année.
L|l|😇|Séraphin aux six ailes|Ange|Quand il chante, même les démons se taisent.
L|t|🐯|Raijū, la bête-éclair|Bête mythique|Il dort dans le nombril des orages.

M|l|🪐|L'Astre-Couronne|Divinité|Les planètes tournent autour d'elle. Les dieux aussi.`}
];

/* Construction du catalogue */
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let s = seed || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; }; }
const STAT_BASE = {C:[1,3], P:[2,4], R:[3,6], E:[5,8], L:[8,10], M:[11,12]};
const CARDS = {};
for (const s of SERIES) {
  const rows = s.list.trim().split("\n").map(l => {
    const [r, el, em, name, type, flavor] = l.split("|").map(x => x.trim());
    return {r, el, em, name, type, flavor};
  });
  rows.sort((a, b) => RAR[a.r].ord - RAR[b.r].ord || EL_ORDER.indexOf(a.el) - EL_ORDER.indexOf(b.el));
  s.cards = [];
  s.main = rows.filter(r => r.r !== "M").length;
  rows.forEach((c, i) => {
    c.no = i + 1; c.series = s.code; c.id = s.code + String(c.no).padStart(3, "0");
    const R = rng(hash(c.id + c.name)); const [lo, hi] = STAT_BASE[c.r];
    c.atk = lo + Math.round(R() * (hi - lo)); c.def = lo + Math.round(R() * (hi - lo));
    c.art = {sx: 15 + R() * 70 | 0, sy: 14 + R() * 22 | 0, ss: 5 + R() * 6 | 0, st1: `${R() * 13 | 0}cqw ${R() * 11 | 0}cqw`, st2: `${R() * 19 | 0}cqw ${R() * 17 | 0}cqw`, h1: 10 + R() * 40 | 0, h2: 55 + R() * 40 | 0};
    CARDS[c.id] = c; s.cards.push(c);
  });
}
const SER = Object.fromEntries(SERIES.map(s => [s.code, s]));
const ALL = Object.values(CARDS);

/* ============================ Sauvegarde ============================ */
const LS_KEY = "ombrelune-collection-v1";
function fresh() { return {v: 1, rev: 0, coins: START_COINS, owned: {}, packs: 0, pity: 0, nextFree: 0, lastDaily: "", bonus: {}, best: "", made: Date.now()}; }
function normalize(x) { const f = fresh(); if (!x || typeof x !== "object") return f; return Object.assign(f, x, {owned: Object.assign({}, x.owned || {}), bonus: Object.assign({}, x.bonus || {})}); }
let S = (() => { try { return normalize(JSON.parse(localStorage.getItem(LS_KEY))); } catch { return fresh(); } })();
let dbDoc = null, writing = false, pending = false, saveTimer = 0, syncMode = "local";

function setSync(m) { syncMode = m; const el = document.getElementById("sync"); el.className = "sync " + m;
  el.title = m === "cloud" ? "Collection sauvegardée en ligne" : m === "saving" ? "Sauvegarde…" : "Sauvegarde sur cet appareil uniquement"; }
function save() {
  S.rev = (S.rev || 0) + 1; S.updated = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch {}
  if (dbDoc) { clearTimeout(saveTimer); saveTimer = setTimeout(pushRemote, 1200); }
}
async function pushRemote() {
  if (!dbDoc) return;
  if (writing) { pending = true; return; }
  writing = true; setSync("saving");
  const body = {state: JSON.parse(JSON.stringify(S))};
  try { await dbDoc.set(body); setSync("cloud"); }
  catch (e) {
    if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 1500 + Math.random() * 1500)); try { await dbDoc.set(body); setSync("cloud"); } catch { setSync("local"); } }
    else setSync("local");
  }
  writing = false;
  if (pending) { pending = false; pushRemote(); }
}
async function connectCloud() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc("data/users/" + id + "/save");
    let done = false;
    const timer = setTimeout(() => { if (!done) setSync("local"); }, 10000);
    const snap = await ref.get(); done = true; clearTimeout(timer);
    dbDoc = ref;
    const remote = snap.exists ? (snap.data() || {}).state : null;
    if (remote && (remote.rev || 0) > (S.rev || 0)) {
      S = normalize(JSON.parse(JSON.stringify(remote)));
      try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch {}
      setSync("cloud"); renderAll(); toast("Collection récupérée depuis votre compte");
    } else if (!remote || (S.rev || 0) > (remote.rev || 0)) { await pushRemote(); }
    else setSync("cloud");
  } catch { setSync("local"); }
}

/* ============================ Logique ============================ */
const own = id => S.owned[id] || [0, 0];
const ownedAny = id => { const o = own(id); return o[0] + o[1] > 0; };
const fmt = n => n.toLocaleString("fr-FR");
const today = () => { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };
const pickFrom = a => a[Math.random() * a.length | 0];
function addCard(id, foil) { const o = own(id).slice(); o[foil ? 1 : 0]++; S.owned[id] = o; }
function seriesProgress(code) {
  const s = SER[code]; let have = 0, foils = 0;
  for (const c of s.cards) { const o = own(c.id); if (o[0] + o[1] > 0) have++; if (o[1] > 0) foils++; }
  return {have, foils, total: s.cards.length};
}
function checkSeriesBonus() {
  for (const s of SERIES) {
    const p = seriesProgress(s.code);
    if (p.have === p.total && !S.bonus[s.code]) {
      S.bonus[s.code] = Date.now(); S.coins += SERIES_BONUS;
      toast(`Série ${s.name} complète ! +${fmt(SERIES_BONUS)} 🌙`);
    }
  }
}
function rollTop(forceHigh) {
  const x = Math.random() * 100;
  if (forceHigh) return x < 6 ? "M" : x < 28 ? "L" : "E";
  return x < 1.5 ? "M" : x < 7.5 ? "L" : x < 25 ? "E" : "R";
}
function openPackData(code) {
  const s = SER[code];
  const slots = ["C", "C", "C", Math.random() < .12 ? "R" : "P", Math.random() < .12 ? "R" : "P"];
  const top = rollTop(S.pity >= 9);
  slots.push(top);
  S.pity = "ELM".includes(top) ? 0 : S.pity + 1;
  const used = new Set(), out = [];
  slots.forEach((r, i) => {
    let pool = s.cards.filter(c => c.r === r && !used.has(c.id));
    if (!pool.length) pool = s.cards.filter(c => c.r === r);
    const c = pickFrom(pool); used.add(c.id);
    const foil = Math.random() < (i === 5 ? .12 : .07);
    const o = own(c.id);
    const isNew = o[0] + o[1] === 0, newFoil = foil && o[1] === 0 && !isNew;
    addCard(c.id, foil);
    out.push({id: c.id, foil, isNew, newFoil});
  });
  S.packs++;
  if (RAR[top].ord > (S.best ? RAR[CARDS[S.best].r].ord : -1)) S.best = out[5].id;
  checkSeriesBonus();
  save();
  return out;
}
function claimDaily() {
  if (S.lastDaily !== today()) {
    const first = !S.lastDaily;
    S.lastDaily = today();
    if (!first) { S.coins += DAILY; toast(`Bonus du jour : +${DAILY} 🌙`); }
    save();
  }
}

const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function cardHTML(c, o = {}) {
  const E = ELEM[c.el], a = c.art;

  const cls = ["tc", "r-" + c.r, o.foil && !missing ? "foil" : "", missing ? "missing" : "", o.live ? "live" : ""].join(" ");
  const s = SER[c.series];

  return `<div class="${cls}" style="${st}"><div class="face"><div class="inner">

}
function backHTML(aura) { return `<div class="tc"><div class="back ${aura ? "aura-" + aura : ""}"><span class="mo">🌙</span><span class="wd">Ombrelune</span></div></div>`; }

        <div class="stack">${Array.from({length: Math.min(left, 3)}, (_, k) => `<div class="pile" style="transform:translate(${(k + 1) * 6}px,${(k + 1) * 5}px) rotate(${(k + 1) * 1.5}deg);z-index:${-k - 1}">${backHTML("")}</div>`).join("")}</div>
        <div class="flipper enter" data-act="flip" role="button" tabindex="0" aria-label="Retourner la carte">
          <div class="fl-in"><div class="fl-back">${backHTML(aura === "C" || aura === "P" ? "" : aura)}</div><div class="fl-front">${cardHTML(c, {foil: cur.foil})}
            ${cur.isNew ? `<span class="badge new">Nouveau</span>` : cur.newFoil ? `<span class="badge new">Nouvelle brillante</span>` : ""}</div></div>
          <div class="reveal-label gem g-${c.r}">${RAR[c.r].g} ${RAR[c.r].n}${cur.foil ? " · Brillante" : ""}</div>
        </div></div>
      <div class="hint" id="hint">Touchez pour retourner</div><div class="foot"></div>`;
    return;
  }
  // résumé
  ov.innerHTML = `<div class="bar2"><span class="ttl">Votre booster</span><span class="coins">🌙 ${fmt(S.coins)}</span></div>
    <div class="stage" style="place-items:start center;overflow:auto"><div class="summary">${OPEN.cards.map(x => `<button class="slot" data-act="card" data-id="${x.id}">${cardHTML(CARDS[x.id], {foil: x.foil})}${x.isNew ? `<span class="badge new">Nouveau</span>` : x.newFoil ? `<span class="badge new">Brillante</span>` : ""}</button>`).join("")}</div></div>
    <div class="hint">${OPEN.cards.filter(x => x.isNew).length} nouvelle${OPEN.cards.filter(x => x.isNew).length > 1 ? "s" : ""} carte${OPEN.cards.filter(x => x.isNew).length > 1 ? "s" : ""} ajoutée${OPEN.cards.filter(x => x.isNew).length > 1 ? "s" : ""} à votre collection</div>
    <div class="foot">
      ${freeLeft() ? "" : `<button class="btn free" data-act="again" data-free="1">Booster gratuit</button>`}
      <button class="btn" data-act="again" ${S.coins < PACK_PRICE ? "disabled" : ""}>Encore un · ${PACK_PRICE} 🌙</button>
      <button class="btn ghost" data-act="closeopen">Terminer</button></div>`;
}
let anim = false;
async function tear() {
  if (anim || OPEN.stage !== "pack") return; anim = true;
  const pk = document.querySelector("#ov .pk");
  pk.classList.remove("wiggle"); pk.classList.add("torn");
  await wait(480); pk.classList.add("out"); await wait(420);
  OPEN.stage = "reveal"; OPEN.i = 0; OPEN.flipped = false; anim = false; drawOpen();
}
async function flip() {
  if (anim) return;
  const f = document.querySelector("#ov .flipper"); if (!f) return;
  if (!OPEN.flipped) {
    anim = true; OPEN.flipped = true; f.classList.remove("enter"); f.classList.add("flipped");
    const cur = OPEN.cards[OPEN.i], c = CARDS[cur.id];
    const h = document.getElementById("hint"); if (h) h.textContent = OPEN.i < OPEN.cards.length - 1 ? "Touchez pour la carte suivante" : "Touchez pour voir votre booster";
    await wait(380);
    celebrate(c.r, cur.foil);
    anim = false;
  } else {
    anim = true; f.classList.add("leave"); await wait(300);
    OPEN.i++; OPEN.flipped = false; anim = false;
    if (OPEN.i >= OPEN.cards.length) OPEN.stage = "summary";
    drawOpen();
  }
}
function celebrate(r, foil) {
  const o = RAR[r].ord;
  if (o < 3 && !foil) return;
  const colors = {E: ["#c58bff", "#f0d9ff"], L: ["#ffcf5a", "#fff3c4", "#ff9b5e"], M: ["#ff7ad9", "#ffd66b", "#7ef0c0", "#7ec8ff", "#c58bff"]}[r] || ["#ffffff", "#7ec8ff", "#ff7ad9"];
  const f = document.querySelector("#ov .flipper"); if (!f) return;
  const rc = f.getBoundingClientRect(), cx = rc.left + rc.width / 2, cy = rc.top + rc.height / 2;
  const n = o >= 4 ? 46 : o === 3 ? 26 : 16;
  for (let i = 0; i < n; i++) {
    const sp = document.createElement("span"); sp.className = "spark";
    const ang = Math.random() * Math.PI * 2, dist = 90 + Math.random() * (o >= 4 ? 220 : 140);
    sp.style.cssText = `left:${cx}px;top:${cy}px;background:${pickFrom(colors)};--dx:${Math.cos(ang) * dist}px;--dy:${Math.sin(ang) * dist}px;box-shadow:0 0 8px currentColor`;
    document.body.appendChild(sp); setTimeout(() => sp.remove(), 1200);
  }
  if (o >= 4) {
    const fl = document.createElement("div"); fl.className = "flash";
    fl.style.background = r === "M" ? "radial-gradient(circle, #fff, rgba(255,122,217,.6) 40%, rgba(126,200,255,.3) 70%, transparent)" : "radial-gradient(circle, #fff8dc, rgba(255,207,90,.55) 45%, transparent 80%)";
    document.body.appendChild(fl); setTimeout(() => fl.remove(), 900);
    const ov = document.getElementById("ov"); ov.classList.remove("shake"); void ov.offsetWidth; ov.classList.add("shake");
    try { navigator.vibrate && navigator.vibrate(r === "M" ? [60, 40, 120] : 80); } catch {}
  }
}
function skipAll() { if (!OPEN || anim) return; OPEN.stage = "summary"; drawOpen(); }
function closeOpen() { OPEN = null; $layer.innerHTML = ""; renderAll(); }

/* ============================ Détail d'une carte ============================ */
let DET = null;
function openDetail(id, list) {
  DET = {id, list: list && list.includes(id) ? list : [id], showFoil: own(id)[1] > 0 && own(id)[0] === 0};
  drawDetail();
}
function drawDetail() {
  const c = CARDS[DET.id], o = own(c.id), have = o[0] + o[1] > 0, s = SER[c.series];
  const idx = DET.list.indexOf(c.id);
  const showFoil = have && o[1] > 0 && (DET.showFoil || o[0] === 0);
  const sellN = o[0] > 1 ? RAR[c.r].sell : 0, sellF = o[1] > 1 ? RAR[c.r].sell * 3 : 0;
  let m = document.getElementById("modal");
  if (!m) { m = document.createElement("div"); m.id = "modal"; m.className = "modal"; m.setAttribute("role", "dialog"); m.setAttribute("aria-modal", "true"); document.body.appendChild(m); }
  m.innerHTML = `<div class="mtop"><span class="eyebrow">${esc(s.name)} · ${c.series} ${String(c.no).padStart(3, "0")}</span><button class="iconbtn" data-act="closedet" aria-label="Fermer">✕</button></div>
    <div class="detail">
      <div class="tiltzone" id="tilt">
        <button class="iconbtn" data-act="prev" aria-label="Carte précédente" ${idx > 0 ? "" : "disabled style='visibility:hidden'"}>‹</button>
        ${cardHTML(c, {missing: !have, foil: showFoil, live: true})}
        <button class="iconbtn" data-act="next" aria-label="Carte suivante" ${idx >= 0 && idx < DET.list.length - 1 ? "" : "disabled style='visibility:hidden'"}>›</button>
      </div>
      <div class="dinfo">
        <h2>${have ? esc(c.name) : "Carte inconnue"}</h2>
        <div class="meta"><span class="gem g-${c.r}">${RAR[c.r].g} ${RAR[c.r].n}</span><span>${ELEM[c.el].s} ${ELEM[c.el].n}</span>${have ? `<span>${esc(c.type)}</span><span>⚔ ${c.atk} · 🛡 ${c.def}</span>` : ""}</div>
        ${have ? `<div class="own"><span>Normale ×${o[0]}</span><span>✦ Brillante ×${o[1]}</span></div>` : `<p class="note">Vous ne possédez pas encore cette carte. Trouvez-la dans un booster ${esc(s.name)} ou fabriquez-la.</p>`}
        <div class="acts">
          ${have && o[0] > 0 && o[1] > 0 ? `<button class="btn sm ghost" data-act="togglefoil">${showFoil ? "Voir la version normale" : "Voir la version brillante"}</button>` : ""}
          ${!have ? `<button class="btn sm" data-act="craft" ${S.coins < RAR[c.r].craft ? "disabled" : ""}>Fabriquer · ${fmt(RAR[c.r].craft)} 🌙</button>` : ""}
          ${sellN ? `<button class="btn sm ghost" data-act="sell" data-f="0">Recycler un double · +${sellN} 🌙</button>` : ""}
          ${sellF ? `<button class="btn sm ghost" data-act="sell" data-f="1">Recycler une brillante en double · +${sellF} 🌙</button>` : ""}
        </div>
        ${have ? `<p class="note">Faites glisser votre doigt sur la carte pour la faire pivoter.</p>` : ""}
      </div></div>`;
  bindTilt();
}
function bindTilt() {
  const z = document.getElementById("tilt"); if (!z) return;
  const card = z.querySelector(".tc");
  const move = e => {
    const r = card.getBoundingClientRect();
    const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    card.style.setProperty("--ry", ((x - .5) * 28) + "deg"); card.style.setProperty("--rx", ((.5 - y) * 28) + "deg");
    card.style.setProperty("--fx", (x * 100) + "%"); card.style.setProperty("--fy", (y * 100) + "%");
    card.style.setProperty("--gx", (x * 100) + "%"); card.style.setProperty("--gy", (y * 100) + "%");
  };
  const reset = () => { card.style.setProperty("--rx", "0deg"); card.style.setProperty("--ry", "0deg"); };
  card.addEventListener("pointermove", move); card.addEventListener("pointerdown", move);
  card.addEventListener("pointerleave", reset); card.addEventListener("pointerup", reset); card.addEventListener("pointercancel", reset);
}
function closeDetail() { DET = null; const m = document.getElementById("modal"); if (m) m.remove(); renderAll(); }

/* ============================ Petits outils d'interface ============================ */
const wait = ms => new Promise(r => setTimeout(r, matchMedia("(prefers-reduced-motion: reduce)").matches ? 10 : ms));
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2700); }
function ask(title, text, ok) {
  return new Promise(res => {
    const d = document.createElement("div"); d.className = "sheet";
    d.innerHTML = `<div class="box" role="dialog" aria-modal="true"><h2 style="font-size:24px">${esc(title)}</h2><p>${esc(text)}</p>
      <div class="acts"><button class="btn ghost sm" data-r="0">Annuler</button><button class="btn sm" data-r="1">${esc(ok)}</button></div></div>`;
    d.addEventListener("click", e => { const b = e.target.closest("[data-r]"); if (b || e.target === d) { d.remove(); res(!!(b && b.dataset.r === "1")); } });
    document.body.appendChild(d);
  });
}

/* ============================ Événements ============================ */
document.addEventListener("click", async e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  switch (act) {
    case "open": return startOpen(a.dataset.s, !!a.dataset.free);
    case "tear": return tear();
    case "flip": return flip();
    case "skip": return skipAll();
    case "again": { const code = OPEN.code; OPEN = null; return startOpen(code, !!a.dataset.free); }
    case "closeopen": return closeOpen();
    case "series": ui.series = a.dataset.s; saveUi(); return renderCollection();
    case "filter": ui.filter = a.dataset.v; saveUi(); return renderCollection();
    case "rar": ui.rar = a.dataset.v; saveUi(); return renderCollection();
    case "card": return openDetail(a.dataset.id, OPEN ? OPEN.cards.map(x => x.id) : view === "collection" ? listCache : null);
    case "closedet": return closeDetail();
    case "prev": case "next": {
      const i = DET.list.indexOf(DET.id) + (act === "next" ? 1 : -1);
      if (i >= 0 && i < DET.list.length) { DET.id = DET.list[i]; DET.showFoil = own(DET.id)[1] > 0 && own(DET.id)[0] === 0; drawDetail(); }
      return;
    }
    case "togglefoil": DET.showFoil = !DET.showFoil; return drawDetail();
    case "craft": {
      const c = CARDS[DET.id], cost = RAR[c.r].craft;
      if (S.coins < cost || ownedAny(c.id)) return;
      if (!(await ask("Fabriquer cette carte ?", `${c.name} (${RAR[c.r].n}) coûte ${fmt(cost)} éclats de lune.`, "Fabriquer"))) return;
      S.coins -= cost; addCard(c.id, false); checkSeriesBonus(); save(); renderCoins(); drawDetail();
      celebrateSoft(); return toast(`${c.name} rejoint votre collection`);
    }
    case "sell": {
      const c = CARDS[DET.id], f = a.dataset.f === "1", o = own(c.id).slice();
      if (o[f ? 1 : 0] < 2) return;
      o[f ? 1 : 0]--; S.owned[c.id] = o; const v = RAR[c.r].sell * (f ? 3 : 1); S.coins += v; save(); renderCoins(); drawDetail();
      return toast(`+${v} 🌙`);
    }
    case "sellall": {
      const v = dupValue(); if (!v) return;
      if (!(await ask("Recycler tous les doubles ?", `Vous gardez un exemplaire de chaque carte (normale et brillante) et recevez ${fmt(v)} éclats de lune.`, "Recycler"))) return;
      for (const [id, o] of Object.entries(S.owned)) S.owned[id] = [Math.min(o[0], 1), Math.min(o[1], 1)];
      S.coins += v; save(); renderAll(); return toast(`+${fmt(v)} 🌙`);
    }
    case "reset": {
      if (!(await ask("Recommencer à zéro ?", "Toute votre collection et vos éclats de lune seront effacés, sur tous vos appareils.", "Tout effacer"))) return;
      const rev = S.rev; S = fresh(); S.rev = rev; S.lastDaily = today(); save(); renderAll(); return toast("Nouvelle collection commencée");
    }
  }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[role=button][data-act]")) { e.preventDefault(); e.target.click(); }
  if (e.key === "Escape") { if (DET) closeDetail(); }
});
function celebrateSoft() { try { navigator.vibrate && navigator.vibrate(30); } catch {} }

function route() {
  const h = location.hash.replace("#", "");
  view = VIEWS.includes(h) ? h : "boutique";
  renderAll(); window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
setInterval(() => { if (view === "boutique" && !OPEN && !DET) renderShop(); }, 30000);

claimDaily();
route();
connectCloud();
})();
</script>
</body></html>
