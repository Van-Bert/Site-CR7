<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head><body>
<title>Invocateurs d'Ombrelune</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400;1,500&display=swap">
<style>
/* Layout : une boutique de nuit sous la lune — en-tête collant, contenu défilant, onglets en bas ; boosters et combats prennent tout l'écran. */
:root{
  --night:#100d1a; --night2:#1a1530; --panel:#221c38; --panel2:#2b2447; --line:#3d3460;
  --ink:#f3ead6; --muted:#a79dc2; --moon:#f5d77e; --moon-ink:#2b1f05; --ok:#6fdc8c; --bad:#ff6b6f; --mana:#5aa8ff; --hp:#ff5a64;
  --c:#a9a8b4; --p:#79d391; --r:#6fb2ff; --e:#c58bff; --l:#ffcf5a; --m:#ff7ad9;
  --f-display:"Grenze Gotisch", "Palatino Linotype", Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{min-height:100%;
  background:
    radial-gradient(circle at 18% 12%, rgba(255,255,255,.55) 0 1px, transparent 1.5px) 0 0/97px 89px,
    radial-gradient(circle at 63% 41%, rgba(255,255,255,.35) 0 1px, transparent 1.5px) 0 0/131px 113px,
    radial-gradient(120% 60% at 50% 0%, #2a2150, var(--night) 70%) fixed, var(--night);
  color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--night)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
header.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:9;background:color-mix(in srgb,var(--night) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:8px;padding-block:9px}
.brand{font-family:var(--f-display);font-size:23px;line-height:1;color:var(--moon);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pillc{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:var(--panel2);border:1px solid color-mix(in srgb,var(--moon) 45%,var(--line));font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pillc.pk{border-color:color-mix(in srgb,var(--e) 55%,var(--line))}
.sync{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.sync.cloud{background:var(--ok);box-shadow:0 0 6px var(--ok)}.sync.saving{background:var(--moon)}
main{padding-bottom:calc(86px + env(safe-area-inset-bottom, 0px))}
main .wrap{padding-block:16px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:34px}h2{font-size:26px}h3{font-size:21px}
.lead{color:var(--muted);margin:0;max-width:62ch}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.note{font-size:13.5px;color:var(--muted);margin:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:color-mix(in srgb,var(--night) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.03em}
nav.tabs a .i{font-size:21px;line-height:1;filter:grayscale(.7);opacity:.8}
nav.tabs a[aria-current="page"]{color:var(--moon)}nav.tabs a[aria-current="page"] .i{filter:none;opacity:1}
nav.tabs a .dot{position:absolute;top:6px;right:calc(50% - 20px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 18px;font-weight:800;background:var(--moon);color:var(--moon-ink);font-size:16px;text-align:center;line-height:1.15}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.free{background:linear-gradient(90deg,#7ef0c0,#7ec8ff);color:#06222a}
.btn.hot{background:linear-gradient(90deg,#ff7ad9,#c58bff,#7ec8ff);color:#1a0f24}
.btn.red{background:linear-gradient(180deg,#ff6b6f,#c7333c);color:#fff}
.btn[disabled]{background:var(--panel2);color:var(--muted);border-color:var(--line)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn small{display:block;font-weight:700;font-size:12px;opacity:.8}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--moon);color:var(--moon-ink);border-color:var(--moon)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.bar{height:6px;border-radius:3px;background:var(--night);overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--moon),#fff1c2);border-radius:3px}
.gem{font-weight:800}
.g-C{color:var(--c)}.g-P{color:var(--p)}.g-R{color:var(--r)}.g-E{color:var(--e)}.g-L{color:var(--l)}
.g-M{background:linear-gradient(90deg,#ff7ad9,#ffd66b,#7ef0c0,#7ec8ff,#c58bff);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ——— Boutique ——— */
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:linear-gradient(100deg,color-mix(in srgb,#7ef0c0 18%,var(--panel)),var(--panel));border:1px solid var(--line)}
.banner .t{flex:1;min-width:0}.banner b{display:block}.banner small{color:var(--muted);font-variant-numeric:tabular-nums}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.offer{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;min-width:0;position:relative;overflow:hidden}
.offer .stock{position:absolute;top:12px;right:12px;background:var(--e);color:#1a0f24;font-weight:800;border-radius:999px;padding:3px 10px;font-size:13px}
.offer .meta{font-size:13px;color:var(--muted)}.offer .meta b{color:var(--ink)}
.offer .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.offer .acts .btn{padding:10px 8px;font-size:15px}
.quest{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.quest:last-child{border-bottom:0}
.quest .bar{grid-column:1}
.quest small{color:var(--muted)}
details.odds{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
details.odds summary{font-weight:800;cursor:pointer}
.oddtable{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px;font-variant-numeric:tabular-nums}
.oddtable td{padding:5px 0;border-bottom:1px solid var(--line)}.oddtable td:last-child{text-align:right;color:var(--muted)}

/* ——— Booster ——— */
.pk{container-type:inline-size;width:var(--pw,170px);max-width:100%;position:relative}
.pack{position:relative;aspect-ratio:.64;border-radius:4cqw;overflow:hidden;
  background:radial-gradient(circle at 50% 38%, color-mix(in srgb,var(--pa) 55%,transparent) 0 22cqw, transparent 42cqw),repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 3cqw, transparent 3cqw 6cqw),linear-gradient(165deg,var(--p1),var(--p2));
  box-shadow:0 2cqw 0 rgba(0,0,0,.25), 0 8cqw 16cqw rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4cqw;color:#fff}
.pack::before,.pack .tear{content:"";position:absolute;left:0;right:0;height:7%;background:repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 2.5cqw, rgba(0,0,0,.25) 2.5cqw 5cqw);z-index:2}
.pack::before{bottom:0}.pack .tear{top:0;transition:transform .45s cubic-bezier(.5,-.3,.6,1), opacity .45s}
.pack::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.38) 50%,transparent 62%);background-size:300% 100%;animation:sheen 3.6s ease-in-out infinite;pointer-events:none;z-index:3}
.pack .win{position:relative;width:74cqw;aspect-ratio:1;border-radius:37cqw 37cqw 6cqw 6cqw;overflow:hidden;border:1.4cqw solid rgba(255,255,255,.75);box-shadow:0 0 8cqw var(--pa), inset 0 0 6cqw rgba(0,0,0,.4);margin-top:6cqw}
.pack .win svg{position:absolute;inset:0;width:100%;height:100%}
.pack .pn{font-family:var(--f-display);font-size:10.5cqw;line-height:.95;text-align:center;padding:0 8cqw;text-shadow:0 1cqw 0 rgba(0,0,0,.5);text-wrap:balance}
.pack .logo{position:absolute;top:10%;font-family:var(--f-display);font-size:7cqw;letter-spacing:.06em;color:var(--moon);z-index:2}
.pack .six{font-size:5.2cqw;font-weight:800;padding:1cqw 4cqw;border-radius:99px;background:rgba(0,0,0,.35)}
.pack .cracks{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0}
.pack .cracks path{fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:120;stroke-dashoffset:120;filter:drop-shadow(0 0 3px var(--glow,#fff)) drop-shadow(0 0 8px var(--glow,#fff))}

/* ——— Carte ——— */
.tc{container-type:inline-size;width:100%;position:relative}
.face{position:relative;aspect-ratio:63/88;border-radius:5cqw;padding:3cqw;display:flex;flex-direction:column;background:var(--frame);box-shadow:0 1.5cqw 5cqw rgba(0,0,0,.5);overflow:hidden;color:#fff}
.face::before{content:"";position:absolute;inset:1.4cqw;border-radius:4cqw;border:.5cqw solid rgba(255,255,255,.35);pointer-events:none;z-index:1}
.r-C .face{--frame:linear-gradient(150deg,#c4c3cd,#5d5c66 55%,#99989f);--rc:#c4c3cd}
.r-P .face{--frame:linear-gradient(150deg,#d6f6dc,#3d8a57 55%,#a7e2b8);--rc:#9fdcb0}
.r-R .face{--frame:linear-gradient(150deg,#ddeeff,#3561a8 55%,#a6ccff);--rc:#9cc6ff}
.r-E .face{--frame:linear-gradient(150deg,#f4e2ff,#6a2fa6 50%,#dab2ff);--rc:#d3a6ff}
.r-L .face{--frame:linear-gradient(120deg,#fff3c4,#c4881c 30%,#ffe189 50%,#a86c10 70%,#fff0b5);background-size:250% 250%;animation:goldframe 5s ease-in-out infinite;--rc:#ffd76e}
.r-M .face{--frame:conic-gradient(from var(--ang,0deg),#ff7ad9,#ffd66b,#7ef0c0,#7ec8ff,#c58bff,#ff7ad9);animation:spinframe 6s linear infinite;--rc:#fff}
.inner{position:relative;flex:1;display:flex;flex-direction:column;gap:1.4cqw;border-radius:3cqw;padding:2.2cqw;min-height:0;overflow:hidden;
  background:linear-gradient(172deg, color-mix(in srgb,var(--ea) 50%,#1a1426), color-mix(in srgb,var(--eb) 88%,#0c0a12) 75%);box-shadow:inset 0 0 0 .5cqw rgba(0,0,0,.4)}
.inner::after{content:"";position:absolute;right:-6cqw;bottom:6cqw;width:42cqw;height:42cqw;background:var(--wm) center/contain no-repeat;opacity:.08;pointer-events:none}
.hd{position:relative;z-index:2;display:flex;align-items:center;gap:2cqw;padding:1.2cqw 2cqw 1.2cqw 13cqw;border-radius:2cqw;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.25));box-shadow:inset 0 0 0 .4cqw color-mix(in srgb,var(--rc) 45%,transparent)}
.hd .nm{flex:1;min-width:0;font-family:var(--f-display);font-size:6.4cqw;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 .6cqw 0 rgba(0,0,0,.6)}
.hd .nm.long{font-size:5.2cqw}
.hd .es{width:7.6cqw;height:7.6cqw;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.45);color:var(--ea);box-shadow:0 0 0 .45cqw color-mix(in srgb,var(--ea) 70%,#fff)}
.hd .es svg{width:5cqw;height:5cqw}
.art{position:relative;height:58cqw;flex:none;border-radius:2cqw;overflow:hidden;background:#151126;box-shadow:0 0 0 .6cqw color-mix(in srgb,var(--rc) 60%,#000)}
.art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.typ{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:2cqw;font-size:3.8cqw;font-weight:700;padding:.9cqw 2.2cqw;border-radius:1.6cqw;background:rgba(0,0,0,.45);white-space:nowrap}
.typ span:first-child{overflow:hidden;text-overflow:ellipsis}.typ .gem{font-size:4.6cqw}
.txt{position:relative;z-index:2;flex:1;min-height:0;display:flex;flex-direction:column;gap:1.2cqw;padding:2cqw 2.4cqw 2cqw;border-radius:1.6cqw;background:linear-gradient(180deg,rgba(255,248,232,.13),rgba(255,248,232,.06));overflow:hidden}
.txt .ab{font-size:4.2cqw;line-height:1.25;color:#fbf4e6}
.txt .ab b{color:var(--moon)}
.txt .fl{font-style:italic;font-size:3.7cqw;line-height:1.25;color:#d9cfe6;opacity:.9;border-top:.3cqw solid rgba(255,255,255,.15);padding-top:1.2cqw}
.txt .ab:empty{display:none}.txt .ab:empty + .fl{border-top:0;padding-top:0;font-size:4.2cqw}
.ft{position:relative;z-index:2;display:flex;justify-content:center;font-size:3.2cqw;font-weight:800;font-variant-numeric:tabular-nums;opacity:.85;letter-spacing:.05em;min-height:9cqw;align-items:center}
.cost{position:absolute;z-index:3;top:2cqw;left:2cqw;width:13cqw;height:14.4cqw;display:grid;place-items:center;font-weight:800;font-size:7.6cqw;color:#fff;text-shadow:0 .5cqw 0 rgba(0,0,0,.5);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:radial-gradient(circle at 35% 30%,#bfe3ff,#3a8cff 45%,#123a8a)}
.sa,.sh{position:absolute;z-index:3;bottom:2.4cqw;width:14cqw;height:14cqw;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:7.4cqw;text-shadow:0 .5cqw 0 rgba(0,0,0,.55);box-shadow:0 0 0 .7cqw rgba(0,0,0,.45),inset 0 -1.5cqw 2cqw rgba(0,0,0,.3)}
.sa{left:2.4cqw;background:radial-gradient(circle at 35% 30%,#fff1b0,#e3a52a 50%,#8a5a0a);color:#fff}
.sh{right:2.4cqw;background:radial-gradient(circle at 35% 30%,#ffc2c6,#e8384a 50%,#7a0f1c);color:#fff}
/* Pleine illustration (Légendaire, Mythique) */
.tc.full .art{position:absolute;inset:0;height:auto;border-radius:3cqw;box-shadow:none}
.tc.full .inner{justify-content:space-between}
.tc.full .typ{margin-top:auto}
.tc.full .txt{flex:none;background:linear-gradient(180deg,rgba(10,6,20,.55),rgba(10,6,20,.82));backdrop-filter:blur(1px)}
.tc.full .hd{background:linear-gradient(90deg,rgba(0,0,0,.7),rgba(0,0,0,.2))}
/* Brillante */
.tc.foil .face::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:color-dodge;opacity:.55;z-index:4;
  background:radial-gradient(circle, rgba(255,255,255,.9) 0 .35cqw, transparent .6cqw) 0 0/9cqw 11cqw,
    linear-gradient(115deg,transparent 18%,rgba(255,60,180,.55) 30%,rgba(60,255,255,.55) 40%,rgba(255,255,90,.5) 50%,rgba(80,255,140,.5) 60%,rgba(140,110,255,.55) 70%,transparent 82%);
  background-size:9cqw 11cqw,260% 260%;background-position:0 0,var(--fx,50%) var(--fy,50%);animation:foil 5s ease-in-out infinite alternate}
.tc.foil.live .face::after{animation:none}
.tc.live .face{box-shadow:0 3cqw 10cqw rgba(0,0,0,.6),0 0 12cqw color-mix(in srgb,var(--rc) 35%,transparent)}
.tc.live .face > .glare{position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:inherit;background:radial-gradient(circle at var(--gx,30%) var(--gy,20%), rgba(255,255,255,.35), transparent 45%);mix-blend-mode:overlay}
.badge{position:absolute;z-index:6;font-size:11px;font-weight:800;letter-spacing:.06em;padding:2px 7px;border-radius:99px;text-transform:uppercase;white-space:nowrap}
.badge.new{top:-7px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06240f;box-shadow:0 0 10px var(--ok)}
.badge.cnt{bottom:-6px;right:-4px;background:var(--night);border:1px solid var(--line);color:var(--ink);font-size:12px;text-transform:none}
.badge.fo{bottom:-6px;left:-4px;background:linear-gradient(90deg,#ff7ad9,#7ef0c0,#7ec8ff);color:#1a0f24}
.badge.dk{top:-6px;right:-4px;background:var(--moon);color:var(--moon-ink);text-transform:none}
.tc.missing .face{--frame:linear-gradient(150deg,#2e2747,#1b1630);box-shadow:none;outline:1px dashed var(--line)}
.tc.missing .inner{background:linear-gradient(172deg,#211b36,#141022);box-shadow:none}
.tc.missing .nm,.tc.missing .txt,.tc.missing .typ span:first-child{color:var(--muted)}
.tc.missing .cost,.tc.missing .sa,.tc.missing .sh{filter:grayscale(1) brightness(.5)}
.back{aspect-ratio:63/88;border-radius:5cqw;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 50%, rgba(245,215,126,.25) 0 18cqw, transparent 34cqw),radial-gradient(circle, rgba(255,255,255,.6) 0 .4cqw, transparent .7cqw) 0 0/11cqw 13cqw,
    repeating-conic-gradient(from 0deg at 50% 50%, rgba(245,215,126,.06) 0 10deg, transparent 10deg 20deg),linear-gradient(160deg,#2b2160,#120d29);
  box-shadow:inset 0 0 0 3cqw #1a1438, inset 0 0 0 3.8cqw var(--moon), inset 0 0 0 6cqw #1a1438, 0 2cqw 6cqw rgba(0,0,0,.5);display:grid;place-items:center}
.back .mo{width:30cqw;height:30cqw;color:var(--moon);filter:drop-shadow(0 0 5cqw var(--moon))}.back .mo svg{width:100%;height:100%}
.back .wd{position:absolute;bottom:13%;width:100%;text-align:center;font-family:var(--f-display);font-size:8cqw;color:var(--moon);letter-spacing:.08em}
.back.aura-R{box-shadow:inset 0 0 0 3cqw #1a1438, inset 0 0 0 3.8cqw var(--moon), inset 0 0 0 6cqw #1a1438, 0 0 10cqw var(--r)}
.back.aura-E{box-shadow:inset 0 0 0 3cqw #1a1438, inset 0 0 0 3.8cqw var(--moon), inset 0 0 0 6cqw #1a1438, 0 0 14cqw var(--e);animation:throb 1.2s ease-in-out infinite}
.back.aura-L{box-shadow:inset 0 0 0 3cqw #1a1438, inset 0 0 0 3.8cqw var(--moon), inset 0 0 0 6cqw #1a1438, 0 0 18cqw var(--l);animation:throb .8s ease-in-out infinite}
.back.aura-M{box-shadow:inset 0 0 0 3cqw #1a1438, inset 0 0 0 3.8cqw var(--moon), inset 0 0 0 6cqw #1a1438, 0 0 20cqw var(--m), 0 0 40cqw #7ec8ff;animation:throb .6s ease-in-out infinite}

/* ——— Collection, deck ——— */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 12px}
.slot{position:relative;display:block;width:100%;padding:0;text-align:left}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tools .sp{flex:1}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}.stat span{font-size:13px;color:var(--muted)}
.rows{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.rows .r{display:grid;grid-template-columns:110px 1fr 64px;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.rows .r:last-child{border-bottom:0}.rows .r span:last-child{text-align:right;color:var(--muted)}
.dl{display:grid;gap:6px}
.drow{display:grid;grid-template-columns:30px 44px 1fr auto;align-items:center;gap:10px;padding:6px 8px 6px 6px;border-radius:12px;background:var(--panel);border:1px solid var(--line);min-width:0}
.drow .cg{width:28px;height:31px;display:grid;place-items:center;font-weight:800;color:#fff;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:radial-gradient(circle at 35% 30%,#bfe3ff,#3a8cff 45%,#123a8a)}
.drow .pt{width:44px;height:44px;border-radius:10px;overflow:hidden;position:relative;border:2px solid var(--rcol,var(--line))}
.drow .pt svg{position:absolute;inset:0;width:100%;height:100%}
.drow .nm{min-width:0}.drow .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.drow .nm small{color:var(--muted);font-size:12.5px}
.drow .ac{display:flex;gap:6px;align-items:center}
.drow .q{font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted);min-width:22px;text-align:right}
.rb{width:34px;height:34px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:18px;display:grid;place-items:center}
.rb[disabled]{opacity:.35}
.curve{display:flex;gap:6px;align-items:flex-end;height:64px}
.curve div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.curve i{display:block;width:100%;background:linear-gradient(180deg,#7ec8ff,#3a8cff);border-radius:4px 4px 0 0;min-height:2px}

/* ——— Campagne ——— */
.chapter{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.chapter .hdr{padding:14px 16px;background:linear-gradient(110deg,var(--p1),var(--p2));display:flex;align-items:center;gap:12px}
.chapter .hdr .t{flex:1;min-width:0}.chapter .hdr small{opacity:.85}
.chapter.locked{opacity:.55}
.duels{display:grid;gap:0}
.duel{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.duel .av{width:54px;height:54px;border-radius:50%;overflow:hidden;position:relative;border:2px solid var(--rcol,var(--line));background:#151126}
.duel .av svg{position:absolute;inset:0;width:100%;height:100%}
.duel .nm{min-width:0}.duel .nm b{display:block}.duel .nm small{color:var(--muted)}
.duel.done .av::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,30,15,.55);color:var(--ok);font-weight:800;font-size:22px}
.duel.boss{background:linear-gradient(90deg,color-mix(in srgb,var(--l) 10%,transparent),transparent)}
.lvl{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);margin-left:6px;vertical-align:2px}

/* ——— Superpositions ——— */
.ov{position:fixed;inset:0;z-index:50;background:radial-gradient(100% 70% at 50% 40%, #2b2158 0%, #0b0915 75%);display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(16px, env(safe-area-inset-left, 0px));overflow:hidden}
.ov .bar2{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:40px;position:relative;z-index:3}
.ov .bar2 .ttl{font-family:var(--f-display);font-size:22px;color:var(--moon)}
.ov .stage{flex:1;width:100%;display:grid;place-items:center;position:relative;perspective:1200px;min-height:0}
.ov .stage > *{grid-area:1/1}
.ov .hint{color:var(--muted);font-size:14px;text-align:center;min-height:22px;position:relative;z-index:3}
.ov .foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%;max-width:560px;position:relative;z-index:3}
.godrays{position:absolute;inset:-50%;pointer-events:none;opacity:0;transition:opacity .6s;background:repeating-conic-gradient(from 0deg at 50% 50%, color-mix(in srgb,var(--ray,#fff) 30%,transparent) 0 7deg, transparent 7deg 20deg);animation:spin 16s linear infinite;-webkit-mask:radial-gradient(circle,#000 10%,transparent 60%);mask:radial-gradient(circle,#000 10%,transparent 60%)}
.godrays.on{opacity:1}
.packstage{display:grid;place-items:center;gap:16px;cursor:pointer;position:relative;z-index:2}
.packstage .pk{--pw:min(62vw, 250px, calc(44vh * .64));animation:floaty 3s ease-in-out infinite}
.packstage .pk.charging .pack{animation:charge 1.2s ease-in forwards}
.packstage .pk.charging .cracks{opacity:1}
.packstage .pk.charging .cracks path{animation:draw 1.1s ease-out forwards}
.packstage .pk.burst{animation:burst .45s ease-out forwards}
.flipper{width:min(74vw, 320px, calc(56vh * .716));position:relative;cursor:pointer;z-index:2}
.flipper .fl-in{position:relative;aspect-ratio:63/88;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.flipper .fl-in > *{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flipper .fl-front{transform:rotateY(180deg)}
.flipper.flipped .fl-in{transform:rotateY(180deg)}
.flipper.enter{animation:dealIn .5s cubic-bezier(.2,1.2,.4,1)}
.flipper.tremble .fl-in{animation:tremble .12s linear infinite}
.flipper.leave{transition:transform .35s ease-in, opacity .35s;transform:translateX(-130%) rotate(-16deg);opacity:0}
.flipper.cine .fl-in{transition:transform 1.1s cubic-bezier(.2,1.4,.3,1)}
.flipper.cine.flipped{animation:cinePop 1.2s cubic-bezier(.2,1.3,.4,1)}
.stack{position:relative;aspect-ratio:63/88;width:min(74vw, 320px, calc(56vh * .716));pointer-events:none}
.stack .pile{container-type:inline-size;position:absolute;inset:0}
.counter{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.reveal-label{position:absolute;left:-20%;right:-20%;bottom:-52px;text-align:center;font-family:var(--f-display);font-size:28px;opacity:0;transition:opacity .3s}
.flipped .reveal-label{opacity:1}
.slam{position:fixed;left:0;right:0;top:16%;z-index:58;text-align:center;font-family:var(--f-display);font-size:clamp(44px,14vw,84px);line-height:1;pointer-events:none;animation:slam 2.2s cubic-bezier(.2,1.4,.4,1) forwards;text-shadow:0 4px 0 #000,0 0 30px currentColor}
.multi{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;overflow:auto;max-height:100%;padding:10px 4px 20px;align-content:start;position:relative;z-index:2}
.multi .mc{position:relative;cursor:pointer;perspective:600px}
.multi .mc .fl-in{position:relative;aspect-ratio:63/88;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
.multi .mc .fl-in > *{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.multi .mc .fl-front{transform:rotateY(180deg)}
.multi .mc.flipped .fl-in{transform:rotateY(180deg)}
.multi .mc.flipped.hi{z-index:2}
.multi .mc .badge.new{font-size:8px;padding:1px 4px;top:-5px}
.packrain{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%;max-width:520px;position:relative;z-index:2}
.packrain .pk{--pw:100%}
.packrain .pk.pop{animation:burst .4s ease-out forwards}
.best{display:flex;gap:10px;justify-content:center;width:100%;max-width:560px;overflow-x:auto;padding:12px 4px 4px;position:relative;z-index:3}
.best .slot{width:96px;flex:none}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px;width:100%;max-width:440px;overflow:auto;padding:10px 4px;position:relative;z-index:2}
.flash{position:fixed;inset:0;z-index:60;pointer-events:none;animation:flash .9s ease-out forwards}
.spark{position:fixed;z-index:61;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:spark 1.1s cubic-bezier(.1,.7,.3,1) forwards}
.shard{position:fixed;z-index:61;width:10px;height:14px;pointer-events:none;clip-path:polygon(50% 0,100% 60%,40% 100%,0 40%);animation:shard 1s cubic-bezier(.1,.7,.3,1) forwards}
.shake{animation:shakeA .5s}
.bigshake{animation:shakeB .7s}
.modal{position:fixed;inset:0;z-index:65;background:rgba(8,6,16,.88);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;overflow:auto;
  padding:calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(16px, env(safe-area-inset-left, 0px))}
.modal .mtop{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);font-size:18px;display:grid;place-items:center;flex:none}
.detail{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:14px}
.tiltzone{perspective:900px;padding:12px 0;touch-action:none;display:flex;align-items:center;gap:8px;width:100%;justify-content:center}
.tiltzone .tc{width:min(68vw, 300px, calc(52vh * .716));transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;will-change:transform}
.dinfo{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px}
.dinfo h2{font-size:28px}
.dinfo .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.dinfo .own{display:flex;gap:10px;flex-wrap:wrap}
.dinfo .own span{background:var(--night);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:700;font-variant-numeric:tabular-nums}
.dinfo .abl{font-size:14.5px;line-height:1.45}.dinfo .abl b{color:var(--moon)}
.sheet{position:fixed;inset:0;z-index:80;background:rgba(5,4,10,.7);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px))}
.sheet .box{width:100%;max-width:440px;animation:up .25s ease-out}
.sheet .box p{margin:0;color:var(--muted)}
.sheet .box .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:90;background:var(--panel2);border:1px solid color-mix(in srgb,var(--moon) 50%,var(--line));padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:toast 2.8s ease forwards;max-width:calc(100vw - 32px);text-align:center}

/* ——— Combat ——— */
.bt-ov{position:fixed;inset:0;z-index:52;background:
  radial-gradient(120% 60% at 50% 50%, rgba(90,60,160,.35), transparent 70%),
  linear-gradient(180deg,#1a0f22 0%,#15122a 45%,#15122a 55%,#0f1a24 100%);
  display:flex;flex-direction:column;overflow:hidden;
  padding:calc(env(safe-area-inset-top, 0px) + 6px) max(10px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 6px) max(10px, env(safe-area-inset-left, 0px))}
.bt-ov::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(245,215,126,.4),transparent)}
.bt{max-width:540px;width:100%;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:6px;position:relative;-webkit-user-select:none;user-select:none}
.hero{display:flex;align-items:center;gap:9px;padding:5px 9px;background:rgba(34,28,56,.85);border:1px solid var(--line);border-radius:14px;flex:none;position:relative;transition:box-shadow .2s, border-color .2s}
.hero .av{width:44px;height:44px;border-radius:50%;overflow:hidden;position:relative;flex:none;border:2px solid var(--rcol,var(--moon));background:#151126}
.hero .av svg{position:absolute;inset:0;width:100%;height:100%}
.hero .who{min-width:0;flex:1}
.hero .hname{font-family:var(--f-display);font-size:18px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .sub{font-size:11.5px;color:var(--muted);white-space:nowrap}
.pips{display:flex;gap:2px;margin-top:3px}.pip{width:7px;height:7px;border-radius:2px;transform:rotate(45deg);background:var(--line)}.pip.on{background:var(--mana);box-shadow:0 0 5px var(--mana)}
.hpbig{min-width:52px;height:40px;padding:0 8px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;background:radial-gradient(circle at 35% 30%,#ff9aa0,#d42c3c 55%,#6a0f18);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.manab{font-weight:800;color:#bfe0ff;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.hero.target{border-color:var(--hp);box-shadow:0 0 0 2px var(--hp),0 0 20px color-mix(in srgb,var(--hp) 60%,transparent);animation:pulse 1s ease-in-out infinite}
.quit{flex:none;color:var(--muted);font-size:16px;padding:4px}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:none;padding:5px 0}
.slotb{aspect-ratio:3/4;max-width:100%;border-radius:10px;border:1px dashed rgba(120,100,170,.4);background:rgba(10,8,20,.3)}
.cr{aspect-ratio:3/4;max-width:100%;border-radius:10px;position:relative;background:#151126;border:2px solid var(--rcol);transition:transform .15s, box-shadow .2s;box-shadow:0 4px 10px rgba(0,0,0,.45)}
.cr .ptw{position:absolute;inset:0;border-radius:8px;overflow:hidden}
.cr .ptw svg{position:absolute;inset:0;width:100%;height:100%}
.cr .kw{position:absolute;top:2px;left:2px;right:2px;display:flex;justify-content:center;gap:1px;font-size:11px;line-height:1;filter:drop-shadow(0 1px 1px #000)}
.cr .st{position:absolute;bottom:-7px;min-width:22px;height:22px;padding:0 4px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;border:2px solid #120d1c;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.cr .st.a{left:-5px;background:radial-gradient(circle at 35% 30%,#fff1b0,#e3a52a 50%,#8a5a0a)}
.cr .st.h{right:-5px;background:radial-gradient(circle at 35% 30%,#ffc2c6,#e8384a 50%,#7a0f1c)}
.cr .st.h.hurt{background:#6a0f18;color:#ffc2c6}.cr .st.a.up{background:radial-gradient(circle at 35% 30%,#fff,#ffd76e 50%,#c98a12)}
.cr.ready{box-shadow:0 0 0 2px var(--ok),0 0 16px color-mix(in srgb,var(--ok) 55%,transparent)}
.cr.sel{transform:translateY(-6px) scale(1.07);box-shadow:0 0 0 3px var(--moon),0 0 24px color-mix(in srgb,var(--moon) 70%,transparent);z-index:2}
.cr.target{box-shadow:0 0 0 2px var(--hp),0 0 18px color-mix(in srgb,var(--hp) 65%,transparent);animation:pulse 1s ease-in-out infinite}
.cr.guard::before{content:"";position:absolute;inset:-4px;border-radius:13px;border:2px solid #9fb4ff;box-shadow:0 0 8px #9fb4ff;pointer-events:none}
.cr.shield::after{content:"";position:absolute;inset:-6px;border-radius:15px;background:radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(255,246,201,.35) 72%,transparent 80%);border:2px solid #fff6c9;box-shadow:0 0 12px #fff3a8;pointer-events:none;animation:throb 1.6s ease-in-out infinite}
.cr.frozen .ptw{filter:saturate(.3) brightness(1.15) hue-rotate(160deg)}
.cr.frozen .ice{position:absolute;inset:0;border-radius:8px;background:linear-gradient(135deg,rgba(190,235,255,.45),rgba(120,200,255,.15));box-shadow:inset 0 0 10px #bfeaff;pointer-events:none}
.cr.sleep .ptw{filter:brightness(.72)}
.cr .zz{position:absolute;right:3px;top:14px;font-size:10px;color:#e0d8f0;font-weight:800;text-shadow:0 1px 2px #000}
.cr.enter{animation:summon .55s cubic-bezier(.2,1.5,.4,1)}
.cr.dying{animation:die .5s ease-in forwards}
.hit{animation:shakeA .35s}
.mid{flex:1 1 auto;min-height:62px;max-height:150px;margin-block:auto;display:flex;align-items:stretch;gap:8px}
.info{flex:1;min-width:0;background:rgba(34,28,56,.8);border:1px solid var(--line);border-radius:12px;padding:7px 10px;display:flex;flex-direction:column;justify-content:center;gap:3px;overflow:auto}
.info .t{font-weight:800;font-size:14px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}.info .t small{font-weight:500;color:var(--muted);font-size:11.5px}
.info .d{font-size:12.5px;color:#ded4ec;line-height:1.3}.info .d b{color:var(--moon)}
.info .hint{font-size:12px;color:var(--muted)}
.info .act{margin-top:3px;align-self:flex-start;background:var(--moon);color:var(--moon-ink);border-radius:8px;padding:6px 14px;font-weight:800}
.info .act[disabled]{background:var(--line);color:var(--muted)}
.endbtn{flex:none;width:86px;border-radius:12px;border:2px solid var(--moon);background:linear-gradient(180deg,#3b2d14,#22190a);color:var(--moon);font-family:var(--f-display);font-size:18px;line-height:1.05;padding:4px}
.endbtn.glow{animation:pulseGold 1.4s ease-in-out infinite}
.endbtn[disabled]{border-color:var(--line);color:var(--muted);background:var(--panel)}
.hand{flex:none;display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;padding:14px 8px 12px;scroll-snap-type:x proximity;scrollbar-width:none}
.hand::-webkit-scrollbar{display:none}
.hand .none{color:var(--muted);font-size:12px;padding:20px 4px;height:134px}
.hc{flex:none;width:94px;height:134px;border-radius:10px;position:relative;scroll-snap-align:start;background:linear-gradient(175deg,color-mix(in srgb,var(--ea) 45%,#221c38),#1a1530 65%);border:2px solid var(--rcol);display:flex;flex-direction:column;transition:transform .18s, box-shadow .2s, opacity .2s;overflow:visible}
.hc .ptw{height:60px;border-radius:8px 8px 0 0;overflow:hidden;position:relative}
.hc .ptw svg{position:absolute;inset:0;width:100%;height:100%}
.hc .cg{position:absolute;top:-8px;left:-8px;width:26px;height:29px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:radial-gradient(circle at 35% 30%,#bfe3ff,#3a8cff 45%,#123a8a);z-index:2}
.hc .nm{font-weight:800;font-size:11px;line-height:1.1;padding:3px 5px 0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc .tx{font-size:9.3px;line-height:1.18;color:#ddd3ea;padding:2px 5px;overflow:hidden;flex:1;text-align:center}.hc .tx b{color:var(--moon)}
.hc .st{position:absolute;bottom:-7px;min-width:22px;height:22px;padding:0 4px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:13px;border:2px solid #120d1c;color:#fff}
.hc .st.a{left:-5px;background:radial-gradient(circle at 35% 30%,#fff1b0,#e3a52a 50%,#8a5a0a)}.hc .st.h{right:-5px;background:radial-gradient(circle at 35% 30%,#ffc2c6,#e8384a 50%,#7a0f1c)}
.hc.dim{opacity:.55}.hc.playable{box-shadow:0 0 0 2px var(--ok),0 0 12px color-mix(in srgb,var(--ok) 45%,transparent)}
.hc.sel{transform:translateY(-8px);box-shadow:0 0 0 3px var(--moon),0 6px 18px rgba(0,0,0,.5)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.float{position:fixed;transform:translate(-50%,-50%);font-weight:800;font-size:24px;text-shadow:0 2px 0 #000,0 0 8px #000;animation:floatUp 1s ease-out forwards;white-space:nowrap}
.float.dmg{color:#ff6b6f;font-size:28px}.float.heal{color:var(--ok)}.float.info{color:#bfe6ff;font-size:15px}.float.shield{color:#fff3a8;font-size:15px}
.orb{position:fixed;width:16px;height:16px;border-radius:50%;margin:-8px 0 0 -8px;pointer-events:none;z-index:71;box-shadow:0 0 12px 4px var(--oc),0 0 24px 8px var(--oc);background:#fff}

const LS_KEY = "ombrelune-collection-v1";
function fresh() {
  return {v: 3, rev: 0, coins: 1500, owned: {}, res: {SA: 0, ME: 0, CL: 0}, jokers: 10, opened: 0, pity: 0, freeStock: 2, freeLast: Date.now(),
    lastDaily: "", bonus: {}, best: "", deck: [], camp: {}, wins: 0, losses: 0, quests: null, made: Date.now()};

function normalize(x) {
  const f = fresh(); if (!x || typeof x !== "object") return f;
  const n = Object.assign(f, x, {owned: Object.assign({}, x.owned || {}), bonus: Object.assign({}, x.bonus || {}), res: Object.assign({SA: 0, ME: 0, CL: 0}, x.res || {}), camp: Object.assign({}, x.camp || {})});
  if ((x.v || 1) < 2) { const old = Object.keys(n.owned).length; n.coins += old * 25; n.owned = {}; n.bonus = {}; n.best = ""; n.pity = 0; }
  if ((x.v || 1) < 3) { n.jokers = (x.jokers || 0) + 10; n.coins += 500; n.gift3 = true; n.opened = x.packs && typeof x.packs === "number" ? x.packs : (x.opened || 0); delete n.packs; }
  n.v = 3;

async function connectCloud() {
  if (!window.claude || !window.claude.use) return;

    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);

    const snap = await ref.get(); done = true; clearTimeout(timer);

const own = id => S.owned[id] || [0, 0];
const ownedAny = id => { const o = own(id); return o[0] + o[1] > 0; };
const ownedCount = id => { const o = own(id); return o[0] + o[1]; };
const totalPacks = () => S.jokers + S.res.SA + S.res.ME + S.res.CL;
function addCard(id, foil) { const o = own(id).slice(); o[foil ? 1 : 0]++; S.owned[id] = o; }
function tickFree() {
  const n = Math.floor((Date.now() - S.freeLast) / FREE_EVERY);
  if (n > 0) { S.freeStock = Math.min(FREE_MAX, S.freeStock + n); S.freeLast = S.freeStock >= FREE_MAX ? Date.now() : S.freeLast + n * FREE_EVERY; }
}
function freeLeft() { return S.freeStock >= FREE_MAX ? 0 : Math.max(0, S.freeLast + FREE_EVERY - Date.now()); }
function fmtDur(ms) { const m = Math.ceil(ms / 60000); const h = Math.floor(m / 60); return h ? `${h} h ${String(m % 60).padStart(2, "0")}` : `${m} min`; }
function seriesProgress(code) {
  const s = SER[code]; let have = 0, foils = 0;
  for (const c of s.cards) { const o = own(c.id); if (o[0] + o[1] > 0) have++; if (o[1] > 0) foils++; }
  return {have, foils, total: s.cards.length};
}

    if (p.have === p.total && !S.bonus[s.code]) { S.bonus[s.code] = Date.now(); S.coins += SERIES_BONUS; S.jokers += 5; toast(`Série « ${s.name} » complète ! +${fmt(SERIES_BONUS)} 🌙 et 5 boosters`); } }
}
const QPOOL = [
  {k:"open", n:5, txt:"Ouvrir 5 boosters", rw:{coins:150}}, {k:"open", n:15, txt:"Ouvrir 15 boosters", rw:{packs:3}},
  {k:"win", n:1, txt:"Gagner 1 combat", rw:{packs:2}}, {k:"win", n:3, txt:"Gagner 3 combats", rw:{packs:4}},
  {k:"play", n:15, txt:"Invoquer 15 créatures", rw:{coins:200}}, {k:"kill", n:10, txt:"Détruire 10 créatures ennemies", rw:{packs:2}},
  {k:"rare", n:3, txt:"Obtenir 3 cartes Épiques ou mieux", rw:{packs:2}}, {k:"new", n:8, txt:"Découvrir 8 nouvelles cartes", rw:{coins:250}},
  {k:"foil", n:2, txt:"Obtenir 2 cartes brillantes", rw:{packs:1}}
];
function ensureQuests() {
  if (S.quests && S.quests.date === today()) return;
  const R = rng(hash(today() + "q")); const pool = QPOOL.slice(); const list = [];
  while (list.length < 3) { const i = R() * pool.length | 0; const q = pool.splice(i, 1)[0]; if (list.some(x => x.k === q.k)) continue; list.push({...q, have: 0, claimed: false}); }
  S.quests = {date: today(), list};
}
function questProg(k, n = 1) { ensureQuests(); let ch = false; for (const q of S.quests.list) if (q.k === k && q.have < q.n) { q.have = Math.min(q.n, q.have + n); ch = true; if (q.have >= q.n) toast(`Quête accomplie : ${q.txt}`); } return ch; }

    const first = !S.lastDaily; S.lastDaily = today();
    if (!first) { S.coins += DAILY_COINS; S.jokers += DAILY_PACKS; setTimeout(() => toast(`Bonus du jour : +${DAILY_COINS} 🌙 et ${DAILY_PACKS} boosters`), 400); }
    save();

function rollTop(forceHigh) {
  const x = Math.random() * 100;
  if (forceHigh) return x < 6 ? "M" : x < 28 ? "L" : "E";
  return x < 1.5 ? "M" : x < 7.5 ? "L" : x < 25 ? "E" : "R";
}
function genPack(code) {
  const s = SER[code];
  const slots = ["C", "C", "C", Math.random() < .14 ? "R" : "P", Math.random() < .14 ? "R" : "P"];
  const top = rollTop(S.pity >= 9); slots.push(top);
  S.pity = "ELM".includes(top) ? 0 : S.pity + 1;
  const used = new Set(), out = [];
  slots.forEach((r, i) => {
    let pool = s.cards.filter(c => c.r === r && !used.has(c.id)); if (!pool.length) pool = s.cards.filter(c => c.r === r);
    const c = pickFrom(pool); used.add(c.id);
    const foil = Math.random() < (i === 5 ? .12 : .07);
    const o = own(c.id); const isNew = o[0] + o[1] === 0, newFoil = foil && o[1] === 0 && !isNew;

}

  const cands = ALL.filter(c => ownedAny(c.id)).sort((a, b) => cardScore(b) - cardScore(a));

    p: [{idx: 0, isHero: true, isAI: false, name: "Vous", av: myBest, hp: 30, maxHp: 30, mana: 0, maxMana: 0, deck: shuffle(S.deck.slice()), hand: [], board: [], fatigue: 0},
        {idx: 1, isHero: true, isAI: true, name: oc.name, av: oc, hp: cfg.hp, maxHp: cfg.hp, mana: 0, maxMana: 0, deck: shuffle(aiDeck(cfg.lvl, cfg.code, cfg.boss ? cfg.name : null)), hand: [], board: [], fatigue: 0}]};
  if (cfg.boss) { const bi = B.p[1].deck.indexOf(oc.id); if (bi >= 0) { B.p[1].deck.splice(bi, 1); B.p[1].deck.splice(Math.floor(B.p[1].deck.length * .45), 0, oc.id); } }
  for (let i = 0; i < 3; i++) draw(B.p[0]); for (let i = 0; i < 4; i++) draw(B.p[1]);
  $layer.innerHTML = `<div class="bt-ov" id="btov"><div class="bt" id="bt"></div></div>`;
  renderBattle();
  const s = document.createElement("div"); s.className = "bshow"; s.innerHTML = `<div style="text-align:center;display:grid;gap:12px;justify-items:center">${cardHTML(oc)}<div style="font-family:var(--f-display);font-size:26px;max-width:80vw">« ${esc(oc.flavor)} »</div></div>`;
  s.style.animationDuration = "2.2s"; document.body.appendChild(s); await wait(2200); s.remove();
  await beginPlayerTurn(); B.busy = false; renderBattle();
}
function showResult(win) {
  const cfg = B.cfg; let coins = 0, packs = 0, resP = 0; const first = cfg.key && !S.camp[cfg.key];
  if (win) {
    S.wins++; questProg("win");
    if (cfg.key) { if (first) { coins = 150 + cfg.lvl * 60; resP = cfg.boss ? 5 : 2; S.camp[cfg.key] = Date.now(); } else { coins = 60 + cfg.lvl * 20; packs = Math.random() < .4 ? 1 : 0; } }
    else { coins = 80 + cfg.lvl * 25; packs = 1; }
  } else { S.losses++; coins = 30; }
  S.coins += coins; S.jokers += packs; if (resP) S.res[cfg.code] += resP; save();
  const r = document.createElement("div"); r.className = "result"; r.id = "result";
  r.innerHTML = `<div class="big gem ${win ? "g-L" : ""}" style="${win ? "" : "color:var(--muted)"}">${win ? "Victoire" : "Défaite"}</div>
    <p class="lead" style="text-align:center">${win ? (cfg.boss && first ? `${esc(cfg.name)} est vaincu·e. Un nouveau chapitre s'ouvre !` : `${esc(cfg.name)} s'incline.`) : `${esc(cfg.name)} l'emporte. Améliorez votre deck et revenez.`}</p>
    <div class="rw">${coins ? `<span style="animation-delay:.3s">+${coins} 🌙</span>` : ""}${packs ? `<span style="animation-delay:.5s">+${packs} booster libre 🎴</span>` : ""}${resP ? `<span style="animation-delay:.7s">+${resP} boosters « ${esc(SER[cfg.code].name)} » 🎴</span>` : ""}</div>
    <div class="row" style="justify-content:center"><button class="btn" data-act="bt-close">Continuer</button>${resP || packs ? `<button class="btn hot" data-act="bt-open">Ouvrir mes boosters</button>` : `<button class="btn ghost" data-act="bt-retry">Rejouer</button>`}</div>`;
  document.body.appendChild(r);
  if (win && !REDUCED) { const cols = ["#ffcf5a", "#ff7ad9", "#7ef0c0", "#7ec8ff", "#fff"]; for (let i = 0; i < 70; i++) { const c = document.createElement("span"); c.className = "confetti"; c.style.cssText = `left:${Math.random() * 100}vw;background:${pickFrom(cols)};animation-duration:${2 + Math.random() * 2.5}s;animation-delay:${Math.random() * .8}s`; document.body.appendChild(c); setTimeout(() => c.remove(), 5500); } vibrate([40, 40, 100]); }
}
function closeBattle() { B = null; $layer.innerHTML = ""; const r = document.getElementById("result"); if (r) r.remove(); renderAll(); }

/* ——— Rendu du combat ——— */
function selCard() { return B.sel && B.sel.kind === "hand" ? B.p[0].hand.find(h => h.hid === B.sel.hid) : null; }
function selCreature() { return B.sel && B.sel.kind === "board" ? B.p[0].board.find(c => c.uid === B.sel.uid) : null; }
function targetSet() {
  const s = new Set(); if (!B.sel || B.cur !== 0 || B.busy) return s;
  if (B.sel.kind === "board") { const c = selCreature(); if (c && c.attacks > 0) attackTargets(B.p[0]).forEach(t => s.add(keyOf(t))); }
  return s;
}
function resolveK(k) { if (!k) return null; if (k[0] === "h") return B.p[+k.slice(1)]; const u = +k.slice(1); return allCreatures().find(c => c.uid === u) || null; }
function heroHTML(p, tg) {
  const pips = Array.from({length: p.maxMana}, (_, i) => `<span class="pip ${i < p.mana ? "on" : ""}"></span>`).join("");
  return `<div class="hero ${tg.has(keyOf(p)) ? "target" : ""}" data-k="${keyOf(p)}" role="button" tabindex="0">
    <div class="av" style="--rcol:${p.av ? RCOL[p.av.r] : "var(--moon)"}">${p.av ? tile(p.av) : ""}</div>
    <div class="who"><div class="hname">${esc(p.name)}</div><div class="sub">Pioche ${p.deck.length} · Main ${p.hand.length}</div><div class="pips" aria-hidden="true">${pips}</div></div>
    <span class="manab">💎 ${p.mana}/${p.maxMana}</span><span class="hpbig" title="Points de vie">${Math.max(0, p.hp)}</span>
    ${p.isAI ? `<button class="quit" data-act="bt-quit" aria-label="Abandonner">✕</button>` : ""}</div>`;
}
function creatureHTML(c, tg) {
  const mine = c.owner === 0, ready = mine && B.cur === 0 && !B.busy && c.attacks > 0;
  const cls = ["cr", ready ? "ready" : "", B.sel && B.sel.kind === "board" && B.sel.uid === c.uid ? "sel" : "", tg.has("c" + c.uid) ? "target" : "",
    has(c, "garde") ? "guard" : "", c.shield ? "shield" : "", c.frozen ? "frozen" : "", mine && B.cur === 0 && c.attacks === 0 ? "sleep" : "", B.enter.includes(c.uid) ? "enter" : ""].join(" ");
  const kw = c.kw.filter(k => k !== "bouclier" && k !== "garde").map(k => KW[k].ic).join("");
  return `<div class="${cls}" data-k="c${c.uid}" role="button" tabindex="0" style="--rcol:${RCOL[c.r]}" aria-label="${esc(c.name)} ${c.atk} attaque ${c.hp} vie">
    <div class="ptw">${tile(getCard(c.id))}</div>${c.frozen ? `<div class="ice"></div>` : ""}<div class="kw">${kw}</div>
    ${mine && B.cur === 0 && c.attacks === 0 && !c.frozen ? `<span class="zz">z</span>` : ""}
    <span class="st a ${c.atk > c.baseAtk ? "up" : ""}">${c.atk}</span><span class="st h ${c.hp < c.maxHp ? "hurt" : ""}">${Math.max(0, c.hp)}</span></div>`;
}
function boardHTML(p, tg) { let h = p.board.map(c => creatureHTML(c, tg)).join(""); for (let i = p.board.length; i < 5; i++) h += `<div class="slotb"></div>`; return `<div class="board">${h}</div>`; }
function infoHTML() {
  const me = B.p[0], myTurn = B.cur === 0 && !B.busy && !B.over;
  if (B.sel && B.sel.kind === "hand") {
    const h = selCard(); if (!h) return `<div class="d">${esc(B.log)}</div>`;
    const d = getCard(h.id);
    let act = "";
    if (myTurn) act = d.cost > me.mana ? `<button class="act" disabled>Mana insuffisant (${d.cost})</button>` : me.board.length >= 5 ? `<button class="act" disabled>Plateau plein</button>` : `<button class="act" data-act="bt-play">Invoquer · ${d.cost} 💎</button>`;
    return `<div class="t">${esc(d.name)} <small>${d.atk}/${d.hp} · coût ${d.cost} · <span class="gem g-${d.r}">${RAR[d.r].n}</span></small></div><div class="d">${abilityLong(d)}</div>${act}`;
  }
  if (B.sel && (B.sel.kind === "board" || B.sel.kind === "info")) {
    const o = B.sel.kind === "board" ? selCreature() : resolveK(B.sel.k); if (!o) return `<div class="d">${esc(B.log)}</div>`;
    if (o.isHero) return `<div class="t">${esc(o.name)}</div><div class="d">${Math.max(0, o.hp)}/${o.maxHp} PV · ${o.deck.length} cartes en pioche · ${o.hand.length} en main.</div>`;
    const d = getCard(o.id);
    let st = "";
    if (o.owner === 0 && B.cur === 0) st = o.frozen ? "Gelée." : o.attacks > 0 ? (B.sel.kind === "board" ? "👉 Touchez une cible ennemie en surbrillance." : "Prête à attaquer.") : "Ne peut pas attaquer ce tour-ci.";
    else if (o.frozen) st = "Gelée : n'attaquera pas au prochain tour.";
    return `<div class="t">${esc(o.name)} <small>${o.atk}/${Math.max(0, o.hp)} · ${o.owner === 0 ? "Alliée" : "Ennemie"}</small></div><div class="d">${abilityLong(d)}${o.shield && !o.kw.includes("bouclier") ? "<br><b>Bouclier</b> actif." : ""}</div>${st ? `<div class="hint">${st}</div>` : ""}`;
  }
  return `<div class="d">${esc(B.log || "")}</div>`;
}
function renderBattle() {
  const el = document.getElementById("bt"); if (!el || !B) return;
  const [me, ai] = B.p, tg = targetSet(), myTurn = B.cur === 0 && !B.busy && !B.over;
  const anyMove = myTurn && (me.hand.some(h => canPlay(me, getCard(h.id))) || me.board.some(c => c.attacks > 0));
  const oldHand = el.querySelector(".hand"), scroll = oldHand ? oldHand.scrollLeft : 0;
  const hand = me.hand.length ? me.hand.map(h => { const d = getCard(h.id); const pl = myTurn && canPlay(me, d);
    return `<div class="hc ${pl ? "playable" : ""} ${B.sel && B.sel.hid === h.hid ? "sel" : ""} ${!myTurn || d.cost > me.mana ? "dim" : ""}" data-hid="${h.hid}" role="button" tabindex="0" style="--ea:${FAC[d.f].ea};--rcol:${RCOL[d.r]}">
      <span class="cg">${d.cost}</span><div class="ptw">${portraitSVG(d)}</div><div class="nm">${esc(d.name)}</div><div class="tx">${abilityHTML(d) || "<i>Aucune capacité</i>"}</div>
      <span class="st a">${d.atk}</span><span class="st h">${d.hp}</span></div>`; }).join("") : `<div class="none">Votre main est vide.</div>`;
  el.innerHTML = `${heroHTML(ai, tg)}${boardHTML(ai, tg)}
    <div class="mid"><div class="info" aria-live="polite">${infoHTML()}</div><button class="endbtn ${myTurn && !anyMove ? "glow" : ""}" data-act="bt-end" ${myTurn ? "" : "disabled"}>${myTurn ? "Fin du tour" : "Tour adverse"}</button></div>
    ${boardHTML(me, tg)}${heroHTML(me, tg)}<div class="hand">${hand}</div>`;
  B.enter = [];
  el.querySelector(".hand").scrollLeft = scroll;
}
async function tapBattle(k) {
  const obj = resolveK(k); if (!obj) return;
  const me = B.p[0], myTurn = B.cur === 0 && !B.busy && !B.over;
  if (myTurn && B.sel && B.sel.kind === "board" && targetSet().has(k)) { const c = selCreature(); if (c) { B.busy = true; await attack(c, obj); if (B) { B.busy = false; renderBattle(); } } return; }
  if (!obj.isHero && obj.owner === 0) {
    const same = B.sel && B.sel.kind === "board" && B.sel.uid === obj.uid;
    B.sel = same ? null : myTurn && obj.attacks > 0 ? {kind: "board", uid: obj.uid} : {kind: "info", k};
  } else B.sel = B.sel && B.sel.kind === "info" && B.sel.k === k ? null : {kind: "info", k};
  renderBattle();
}

/* ============================ Événements ============================ */
document.addEventListener("click", async e => {
  const hc = B && e.target.closest(".hc[data-hid]");
  if (hc) { const hid = +hc.dataset.hid; B.sel = B.sel && B.sel.kind === "hand" && B.sel.hid === hid ? null : {kind: "hand", hid}; return renderBattle(); }
  const a = e.target.closest("[data-act]");
  if (!a) { const k = B && e.target.closest("#bt [data-k]"); if (k) return tapBattle(k.dataset.k); if (B && e.target.closest("#bt") && B.sel) { B.sel = null; renderBattle(); } return; }
  const act = a.dataset.act;
  switch (act) {
    case "claimfree": tickFree(); if (S.freeStock) { S.jokers += S.freeStock; toast(`+${S.freeStock} booster${S.freeStock > 1 ? "s" : ""} libre${S.freeStock > 1 ? "s" : ""}`); S.freeStock = 0; save(); renderShop(); } return;
    case "claimq": { const q = S.quests.list[+a.dataset.i]; if (q && q.have >= q.n && !q.claimed) { q.claimed = true; if (q.rw.coins) S.coins += q.rw.coins; if (q.rw.packs) S.jokers += q.rw.packs; save(); renderShop(); toast("Récompense reçue !"); const [x, y] = centerOf(a); sparksAt(x, y, ["#ffcf5a", "#fff"], 20, 100); } return; }
    case "open": return startOpen(a.dataset.s, +a.dataset.n);
    case "tear": return tear();
    case "flip": return flip();
    case "skip": return skipAll();
    case "rainskip": if (OPEN) { OPEN.stage = "grid"; drawOpen(); } return;
    case "mflip": return mflip(+a.dataset.i, false);
    case "flipall": return flipAll();
    case "tosummary": if (OPEN) { OPEN.stage = "summary"; drawOpen(); } return;
    case "again": { const code = OPEN.code; OPEN = null; anim = false; return startOpen(code, +a.dataset.n); }
    case "closeopen": return closeOpen();
    case "series": ui.series = a.dataset.s; saveUi(); return renderCollection();
    case "filter": ui.filter = a.dataset.v; saveUi(); return renderCollection();
    case "rar": ui.rar = a.dataset.v; saveUi(); return renderCollection();
    case "fac": ui.fac = a.dataset.v; saveUi(); return renderCollection();
    case "ctab": ui.ctab = a.dataset.v; saveUi(); return renderCombat();
    case "dfac": ui.dfac = a.dataset.v; saveUi(); return renderCombat();
    case "dauto": autoDeck(); toast("Deck automatique créé"); return renderCombat();
    case "dclear": if (await ask("Vider le deck ?", "Toutes les cartes seront retirées de votre deck.", "Vider")) { S.deck = []; save(); renderCombat(); } return;
    case "dadd": { const id = a.dataset.id; if (S.deck.length < 20 && (deckCounts()[id] || 0) < deckLimit(id)) { S.deck.push(id); save(); } if (a.dataset.re) { drawDetail(); toast("Ajoutée au deck"); } else renderCombat(); return; }
    case "drem": { const i = S.deck.indexOf(a.dataset.id); if (i >= 0) { S.deck.splice(i, 1); save(); } return renderCombat(); }
    case "quick": { const n = Object.keys(S.camp).length; const lvl = Math.min(6, 1 + Math.floor(n / 3)); const c = pickFrom(ALL.filter(x => !"LM".includes(x.r))); return startBattle({name: c.name, lvl, hp: 20 + lvl * 3, code: null}); }
    case "duel": { const ci = +a.dataset.c, di = +a.dataset.d; if (!duelOpen(ci, di)) return; const [n, lvl, hp] = CHAPTERS[ci].duels[di]; return startBattle({name: n, lvl, hp, code: CHAPTERS[ci].code, key: campKey(ci, di), boss: di === 5}); }
    case "bt-end": if (B && !B.busy && !B.over && B.cur === 0) { B.sel = null; await aiTurn(); } return;
    case "bt-play": { if (!B || B.busy) return; const h = selCard(); if (!h) return; B.busy = true; await playCard(B.p[0], h.hid); if (B) { B.busy = false; renderBattle(); } return; }
    case "bt-quit": if (B && !B.busy && await ask("Abandonner le combat ?", "Le combat comptera comme une défaite.", "Abandonner")) { S.losses++; save(); closeBattle(); } return;
    case "bt-close": { const go = B && B.cfg.key ? "combat" : null; closeBattle(); if (go) location.hash = "#combat"; return; }
    case "bt-retry": { const cfg = B.cfg; closeBattle(); return startBattle(cfg); }
    case "bt-open": closeBattle(); location.hash = "#boutique"; return;
    case "card": return openDetail(a.dataset.id, OPEN ? OPEN.cards.map(x => x.id) : view === "collection" ? listCache : null);
    case "closedet": return closeDetail();
    case "prev": case "next": { const i = DET.list.indexOf(DET.id) + (act === "next" ? 1 : -1); if (i >= 0 && i < DET.list.length) { DET.id = DET.list[i]; DET.showFoil = own(DET.id)[1] > 0 && own(DET.id)[0] === 0; drawDetail(); } return; }
    case "togglefoil": DET.showFoil = !DET.showFoil; return drawDetail();
    case "craft": { const c = CARDS[DET.id], cost = RAR[c.r].craft; if (S.coins < cost || ownedAny(c.id)) return;
      if (!(await ask("Fabriquer cette carte ?", `${c.name} (${RAR[c.r].n}) coûte ${fmt(cost)} éclats de lune.`, "Fabriquer"))) return;
      S.coins -= cost; addCard(c.id, false); checkSeriesBonus(); save(); drawDetail(); const t = document.querySelector("#tilt .tc"); if (t) { const [x, y] = centerOf(t); sparksAt(x, y, RCOLS[c.r], 40, 200); } return toast(`${c.name} rejoint votre collection`); }
    case "sell": { const c = CARDS[DET.id], f = a.dataset.f === "1", o = own(c.id).slice(); if (o[f ? 1 : 0] < 2) return; o[f ? 1 : 0]--; S.owned[c.id] = o; const v = RAR[c.r].sell * (f ? 3 : 1); S.coins += v; save(); drawDetail(); return toast(`+${v} 🌙`); }
    case "sellall": { const v = dupValue(); if (!v) return;
      if (!(await ask("Recycler tous les doubles ?", `Vous gardez un exemplaire de chaque carte (et ceux de votre deck) et recevez ${fmt(v)} éclats de lune.`, "Recycler"))) return;
      const dk = deckCounts(); for (const [id, o] of Object.entries(S.owned)) S.owned[id] = [Math.min(o[0], Math.max(1, dk[id] || 0)), Math.min(o[1], 1)];
      S.coins += v; save(); renderAll(); return toast(`+${fmt(v)} 🌙`); }
    case "reset": { if (!(await ask("Recommencer à zéro ?", "Toute votre collection, vos boosters et votre progression seront effacés, sur tous vos appareils.", "Tout effacer"))) return;
      const rev = S.rev; S = fresh(); S.rev = rev; S.lastDaily = today(); save(); renderAll(); return toast("Nouvelle aventure commencée"); }
  }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[role=button]")) { e.preventDefault(); e.target.click(); }
  if (e.key === "Escape" && DET) closeDetail();
});
function route() { const h = location.hash.replace("#", ""); view = VIEWS.includes(h) ? h : "boutique"; if (!OPEN && !B) { renderAll(); window.scrollTo(0, 0); } }
addEventListener("hashchange", route);
setInterval(() => { tickFree(); renderTop(); if (view === "boutique" && !OPEN && !B && !DET && !document.querySelector(".sheet")) renderShop(); }, 30000);

tickFree();
if (S.gift3) { delete S.gift3; save(); setTimeout(() => toast("Mise à jour : combats, quêtes et 10 boosters offerts !"), 700); }
claimDaily();
route();
connectCloud();
})();
</script>
</body></html>
